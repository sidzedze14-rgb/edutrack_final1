// ── UTILITAIRES ───────────────────────────────────────────────────
const calcMoy  =n=>n&&n.length?Math.round(n.reduce((s,x)=>s+x.n*x.c,0)/n.reduce((s,x)=>s+x.c,0)*10)/10:0;
const countAbs =p=>p?p.filter(x=>x.s==="Absent").length:0;
const ini      =(p,n)=>((p||"")[0]+(n||"")[0]).toUpperCase();
const fullName =e=>`${e.prenom} ${e.nom}`;
const lblCls   =c=>`${c.niveau} ${c.section}${c.filiere?` (${c.filiere})`:""}`;
const cycleCls =c=>NIVEAUX_COLLEGE.includes(c.niveau)?"Collège":"Lycée";
const nowStr   =()=>new Date().toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});

// ── HOOK DB ───────────────────────────────────────────────────────
function useDB(){
  const [db,setDb]=useState(null);
  const [saving,setSaving]=useState(false);
  useEffect(()=>{
    try{const r=localStorage.getItem("edutrack-html-v1");setDb(r?JSON.parse(r):JSON.parse(JSON.stringify(DB_DEFAULT)));}
    catch{setDb(JSON.parse(JSON.stringify(DB_DEFAULT)));}
  },[]);
  function save(d){
    setSaving(true);
    try{localStorage.setItem("edutrack-html-v1",JSON.stringify(d));}catch{}
    setDb(d);setTimeout(()=>setSaving(false),600);
  }
  const cl=()=>JSON.parse(JSON.stringify(db));
  return{
    db,saving,
    addClass(c)    {const d=cl();const id=Math.max(0,...d.classes.map(x=>x.id))+1;d.classes.push({...c,id});save(d);},
    deleteClass(id){const d=cl();d.eleves=d.eleves.map(e=>e.classe_id===id?{...e,classe_id:null}:e);d.classes=d.classes.filter(c=>c.id!==id);save(d);},
    addEleve(e)    {const d=cl();const id=Math.max(0,...d.eleves.map(x=>x.id))+1;d.eleves.push({...e,id,av:ini(e.prenom,e.nom)});d.notes[id]=JSON.parse(JSON.stringify(NOTES_DEF));d.presences[id]=[];save(d);},
    deleteEleve(id){const d=cl();d.eleves=d.eleves.filter(e=>e.id!==id);delete d.notes[id];delete d.presences[id];save(d);},
    moveEleve(eid,cid){const d=cl();const e=d.eleves.find(x=>x.id===eid);if(e)e.classe_id=cid;save(d);},
    updateNote(eid,i,v){const d=cl();if(d.notes[eid])d.notes[eid][i].n=v;save(d);},
    addEmail(em)   {const d=cl();d.emails_envoyes=[em,...(d.emails_envoyes||[])];save(d);},
    addVisite(v)   {const d=cl();d.visites=[{...v,id:Date.now()},...(d.visites||[])];save(d);},
    updVisite(id,p){const d=cl();d.visites=d.visites.map(v=>v.id===id?{...v,...p}:v);save(d);},
    addSignal(s)   {const d=cl();d.signalements=[{...s,id:Date.now()},...(d.signalements||[])];save(d);},
    updSignal(id,p){const d=cl();d.signalements=d.signalements.map(s=>s.id===id?{...s,...p}:s);save(d);},
    resetDB()      {save(JSON.parse(JSON.stringify(DB_DEFAULT)));},
  };
}

// ── EXPORT PDF ────────────────────────────────────────────────────
async function exportPDF(eleve,notes,presences){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
  const moy=calcMoy(notes),abs=countAbs(presences),W=210,m=18;
  doc.setFillColor(13,43,94);doc.rect(0,0,W,38,"F");
  doc.setTextColor(255,255,255);doc.setFontSize(20);doc.setFont("helvetica","bold");
  doc.text("EduTrack",m,16);doc.setFontSize(10);doc.setFont("helvetica","normal");
  doc.text("Bulletin scolaire officiel — Année 2025-2026",m,24);
  doc.text(`Édité le : ${new Date().toLocaleDateString("fr-FR")}`,m,31);
  doc.setTextColor(13,43,94);doc.setFillColor(238,243,251);
  doc.roundedRect(m,44,W-m*2,28,3,3,"F");
  doc.setFontSize(14);doc.setFont("helvetica","bold");
  doc.text(fullName(eleve),m+6,55);
  doc.setFontSize(10);doc.setFont("helvetica","normal");doc.setTextColor(107,122,141);
  doc.text(`Classe : ${eleve.classeLabel||"—"}`,m+6,63);
  doc.text(`Moyenne : ${moy}/20`,m+80,63);
  doc.text(`Absences : ${abs}`,m+150,63);
  doc.setTextColor(13,43,94);doc.setFontSize(12);doc.setFont("helvetica","bold");
  doc.text("Résultats par matière",m,84);
  const cols=["Matière","Note /20","Coefficient","Appréciation"],cW=[70,30,35,47];
  let y=90;
  doc.setFillColor(26,79,160);doc.rect(m,y,W-m*2,9,"F");
  doc.setTextColor(255,255,255);doc.setFontSize(9);doc.setFont("helvetica","bold");
  let x=m+2;cols.forEach((c,i)=>{doc.text(c,x,y+6);x+=cW[i];});y+=9;
  notes.forEach((n,idx)=>{
    const ev=idx%2===0;doc.setFillColor(ev?244:255,ev?247:255,ev?252:255);doc.rect(m,y,W-m*2,9,"F");
    doc.setFont("helvetica","normal");doc.setFontSize(9);
    const ap=n.n>=16?"Très bien":n.n>=14?"Bien":n.n>=12?"Assez bien":n.n>=10?"Passable":"Insuffisant";
    let rx=m+2;
    [n.m,`${n.n}/20`,`${n.c}`,ap].forEach((v,i)=>{
      doc.setTextColor(i===1?(n.n>=10?39:229):(13),i===1?(n.n>=10?174:62):(43),i===1?(n.n>=10?96:62):(94));
      doc.text(v,rx,y+6);rx+=cW[i];});y+=9;
  });
  y+=4;doc.setDrawColor(216,226,240);doc.line(m,y,W-m,y);y+=8;
  doc.setFillColor(moy>=10?39:229,moy>=10?174:62,moy>=10?96:62);
  doc.roundedRect(m,y,W-m*2,12,2,2,"F");
  doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(11);
  doc.text(`Moyenne générale : ${moy}/20`,m+6,y+8);
  doc.text(`Mention : ${moy>=16?"Félicitations":moy>=14?"Compliments":moy>=12?"Encouragements":moy>=10?"Passable":"À améliorer"}`,m+110,y+8);y+=20;
  doc.setTextColor(13,43,94);doc.setFont("helvetica","bold");doc.setFontSize(12);
  doc.text("Assiduité",m,y);y+=8;
  presences.slice(0,5).forEach((p,i)=>{
    const ev=i%2===0;doc.setFillColor(ev?244:255,ev?247:255,ev?252:255);doc.rect(m,y,W-m*2,8,"F");
    doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(107,122,141);doc.text(p.date,m+2,y+5.5);
    const sc=p.s==="Présent"?[39,174,96]:p.s==="Retard"?[245,166,35]:[229,62,62];
    doc.setTextColor(...sc);doc.text(p.s,m+40,y+5.5);
    if(p.motif){doc.setTextColor(107,122,141);doc.text(p.motif,m+80,y+5.5);}y+=8;
  });
  doc.setFillColor(13,43,94);doc.rect(0,280,W,17,"F");
  doc.setTextColor(255,255,255);doc.setFontSize(8);doc.setFont("helvetica","normal");
  doc.text("EduTrack — Plateforme de gestion scolaire · Document confidentiel",m,290);
  doc.text("Page 1/1",W-m-10,290);
  doc.save(`Bulletin_${fullName(eleve).replace(/ /g,"_")}_2025-2026.pdf`);
}

function ModuleEmails({db,addEmail}){
  const [tab,setTab]=useState("rapide");

  const [toast,setToast]=useState("");
  const [sujet,setSujet]=useState(""),[corps,setCorps]=useState(""),[sel,setSel]=useState([]);
  const [rEleve,setREleve]=useState(db.eleves[0]?.id||1);
  const [rType,setRType]=useState("absence");
  const st=msg=>{setToast(msg);setTimeout(()=>setToast(""),3000);};
  function envRapide(){
    const e=db.eleves.find(x=>x.id===rEleve);if(!e)return;
    const p=db.presences[e.id]?.find(x=>x.s==="Absent")||{date:"23/06/2026",s:"Absent"};
    const moy=calcMoy(db.notes[e.id]||[]);
    const email=rType==="absence"
      ?{icone:"⚠️",couleur:C.red,sujet:`⚠️ Absence signalée — ${fullName(e)}`,destinataire:e.email_parent,corps:`Madame, Monsieur,\n\nVotre enfant ${fullName(e)} a été absent(e) le ${p.date}${p.motif?` (${p.motif})`:""}.\n\nMerci de nous faire parvenir un justificatif dans les 48h.\n\nCordialement,\nL'Administration — EduTrack`,date:nowStr(),statut:"envoyé"}
      :{icone:"📄",couleur:C.green,sujet:`📄 Bulletin disponible — ${fullName(e)}`,destinataire:e.email_parent,corps:`Madame, Monsieur,\n\nLe bulletin de ${fullName(e)} est disponible.\nMoyenne : ${moy}/20.\n\nConnectez-vous à EduTrack pour le consulter.\n\nCordialement,\nL'Administration`,date:nowStr(),statut:"envoyé"};
    addEmail(email);st(`✅ Email envoyé à ${e.email_parent}`);
  }
  function envLibre(){

  function sign(){
    if(!f.eleve||!f.date||!f.signale_par||!f.description){setErr("Veuillez remplir tous les champs obligatoires.");return;}

}

          <div style={{flex:1}}><div style={{fontWeight:700,color:C.navy,fontSize:14,marginBottom:4}}>{a.titre}</div><div style={{fontSize:12,color:C.gray}}>{a.duree} de lecture</div><div style={{display:"flex",gap:5,marginTop:7,flexWrap:"wrap"}}>{a.tags.slice(0,3).map(t=><span key={t} style={{background:C.light,color:C.blue,borderRadius:20,padding:"2px 8px",fontSize:11,fontWeight:600}}>#{t}</span>)}</div></div>
          <div style={{color:C.gray,fontSize:20,flexShrink:0}}>›</div>
        </div>
      ))}
    </div>;
  }
  return<div>
    <div style={{background:`linear-gradient(135deg,${C.navy},${C.blue})`,borderRadius:14,padding:20,marginBottom:20,color:"#fff"}}>
      <div style={{fontSize:30,marginBottom:8}}>📚</div>
      <div style={{fontWeight:800,fontSize:17,marginBottom:6}}>Espace Sensibilisation</div>
      <div style={{fontSize:13,opacity:.85,lineHeight:1.6}}>Des ressources pour accompagner parents, élèves et enseignants vers la réussite globale de l'enfant.</div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
      {CATS.map(c=>(
        <div key={c.id} onClick={()=>setCat(c.id)} style={{background:C.white,borderRadius:14,padding:18,cursor:"pointer",boxShadow:"0 2px 10px rgba(13,43,94,0.07)",borderTop:`4px solid ${c.color}`,textAlign:"center"}}>
          <div style={{fontSize:36,marginBottom:8}}>{c.icone}</div>
          <div style={{fontWeight:700,color:c.color,fontSize:13}}>{c.label}</div>
          <div style={{fontSize:11,color:C.gray,marginTop:4}}>{ARTS[c.id]?.length||0} article{(ARTS[c.id]?.length||0)>1?"s":""}</div>
        </div>
      ))}
    </div>
    <Card>
      <STit>⭐ Articles populaires</STit>
      {[{c:"parents",a:ARTS.parents[0]},{c:"reussite",a:ARTS.reussite[0]},{c:"biblique",a:ARTS.biblique[0]}].map(({c:cid,a},i,arr)=>{
        const cat2=CATS.find(x=>x.id===cid);
        return<div key={i} onClick={()=>{setCat(cid);setArt(a);}} style={{display:"flex",gap:10,alignItems:"center",padding:"11px 0",borderBottom:i<arr.length-1?`1px solid ${C.border}`:"none",cursor:"pointer"}}>
          <div style={{width:38,height:38,borderRadius:10,background:cat2.color+"15",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>{cat2.icone}</div>
          <div style={{flex:1}}><div style={{fontWeight:700,color:C.navy,fontSize:13}}>{a.titre}</div><div style={{fontSize:11,color:C.gray}}>{cat2.label} · {a.duree}</div></div>
          <div style={{color:C.gray,fontSize:18}}>›</div>
        </div>;
      })}
    </Card>
  </div>;
}

// ── MODULE CLASSES ────────────────────────────────────────────────
function ModuleClasses({db,addClass,deleteClass,addEleve,deleteEleve,moveEleve}){
  const [vue,setVue]=useState("liste");
  const [clsAct,setClsAct]=useState(null);
  const [mCls,setMCls]=useState(false);
  const [mElv,setMElv]=useState(false);
  const [mMove,setMMove]=useState(null);
  const [fil,setFil]=useState("Tous");
  const [conf,setConf]=useState(null);
  const [toast,setToast]=useState("");
  const st=msg=>{setToast(msg);setTimeout(()=>setToast(""),3000);};
  const cls=clsAct?db.classes.find(c=>c.id===clsAct.id):null;
  const elvCls=cls?db.eleves.filter(e=>e.classe_id===cls.id):[];
  const clsFil=db.classes.filter(c=>fil==="Tous"||(fil==="Collège"?NIVEAUX_COLLEGE:NIVEAUX_LYCEE).includes(c.niveau));

  function doConf(){
    if(conf.type==="classe"){deleteClass(conf.id);if(clsAct?.id===conf.id){setClsAct(null);setVue("liste");}st("Classe supprimée.");}
    if(conf.type==="eleve"){deleteEleve(conf.id);st("Élève supprimé.");}
    setConf(null);
  }

  // Formulaire classe inline
  const [cycle,setCycle]=useState("Collège");
  const [niveau,setNiveau]=useState("6ème");
  const [section,setSection]=useState("A");
  const [filiere,setFiliere]=useState("Générale");
  const [effMax,setEffMax]=useState(35);
  const [annee,setAnnee]=useState("2025-2026");
  const [clsErr,setClsErr]=useState("");

  // Formulaire élève inline
  const [prenom,setPrenom]=useState(""),[nom,setNom]=useState("");
  const [genre,setGenre]=useState("M"),[ddn,setDdn]=useState("");
  const [emailP,setEmailP]=useState(""),[cid,setCid]=useState(db.classes[0]?.id||"");
  const [elvErr,setElvErr]=useState("");

  function saveCls(){
    const niveaux=cycle==="Collège"?NIVEAUX_COLLEGE:NIVEAUX_LYCEE;
    const isL=cycle==="Lycée";
    const niv=niveaux.includes(niveau)?niveau:niveaux[0];
    if(db.classes.some(c=>c.niveau===niv&&c.section===section&&c.annee===annee)){setClsErr(`La classe ${niv} ${section} existe déjà !`);return;}
    addClass({niveau:niv,section,filiere:isL?filiere:null,effectif_max:parseInt(effMax),annee});
    setClsErr("");setMCls(false);st(`Classe ${niv} ${section} créée !`);
  }
  function saveElv(){
    if(!prenom.trim()||!nom.trim()){setElvErr("Prénom et nom obligatoires.");return;}
    const c=db.classes.find(x=>x.id===parseInt(cid));
    if(!c){setElvErr("Sélectionnez une classe.");return;}
    if(db.eleves.filter(e=>e.classe_id===parseInt(cid)).length>=c.effectif_max){setElvErr(`Classe complète (max ${c.effectif_max}).`);return;}
    addEleve({prenom:prenom.trim(),nom:nom.trim(),genre,date_naissance:ddn,email_parent:emailP||`${prenom.toLowerCase()}.parent@email.com`,classe_id:parseInt(cid)});
    setPrenom("");setNom("");setDdn("");setEmailP("");setElvErr("");setMElv(false);st(`${prenom} ${nom} ajouté(e) !`);
  }

  if(vue==="detail"&&cls)return<div>
    <Toast msg={toast}/>
    {conf&&<Confirm label={conf.label} onOk={doConf} onCancel={()=>setConf(null)}/>}
    {mElv&&<Modal title="➕ Ajouter un élève" onClose={()=>setMElv(false)}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}><Inp label="Prénom" value={prenom} onChange={e=>setPrenom(e.target.value)} placeholder="Aya" required/><Inp label="Nom" value={nom} onChange={e=>setNom(e.target.value)} placeholder="Konan" required/></div>
      <Sel label="Genre" value={genre} onChange={e=>setGenre(e.target.value)}><option value="M">Masculin</option><option value="F">Féminin</option></Sel>
      <Inp label="Date de naissance" value={ddn} onChange={e=>setDdn(e.target.value)} placeholder="JJ/MM/AAAA"/>
      <Inp label="Email parent" value={emailP} onChange={e=>setEmailP(e.target.value)} placeholder="parent@email.com" type="email"/>
      <Sel label="Classe" value={cid} onChange={e=>setCid(e.target.value)} required>{db.classes.map(c=>{const nb=db.eleves.filter(e=>e.classe_id===c.id).length;return<option key={c.id} value={c.id}>{lblCls(c)} ({nb}/{c.effectif_max})</option>;})}</Sel>
      {elvErr&&<div style={{background:"#FEF2F2",border:`1px solid #FECACA`,borderRadius:8,padding:"9px 12px",marginBottom:12,color:C.red,fontSize:13}}>⚠️ {elvErr}</div>}
      <button onClick={saveElv} style={{width:"100%",padding:11,borderRadius:10,border:"none",background:`linear-gradient(135deg,${C.navy},${C.blue})`,color:"#fff",fontWeight:700,fontSize:14,cursor:"pointer"}}>➕ Ajouter l'élève</button>
    </Modal>}
    {mMove!==null&&<Modal title="🔄 Changer de classe" onClose={()=>setMMove(null)}>
      {db.classes.map(c=>{const nb=db.eleves.filter(e=>e.classe_id===c.id).length,plein=nb>=c.effectif_max;
        return<button key={c.id} onClick={()=>{if(!plein){moveEleve(mMove,c.id);setMMove(null);st("Élève transféré !");}}} disabled={plein}
          style={{display:"flex",justifyContent:"space-between",alignItems:"center",width:"100%",padding:"12px 14px",borderRadius:10,border:`1.5px solid ${C.border}`,background:plein?"#f9f9f9":"#fff",cursor:plein?"not-allowed":"pointer",marginBottom:8,opacity:plein?.6:1}}>
          <div><div style={{fontWeight:700,color:C.navy,fontSize:13}}>{lblCls(c)}</div><div style={{fontSize:11,color:C.gray}}>{cycleCls(c)}</div></div>
          <Bdg label={`${nb}/${c.effectif_max}`} color={plein?C.red:C.green} bg={plein?"#FDECEC":"#E8F8EE"}/>
        </button>;})
      }
    </Modal>}
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
      <button onClick={()=>setVue("liste")} style={{background:C.light,border:"none",color:C.navy,padding:"7px 14px",borderRadius:20,cursor:"pointer",fontWeight:700,fontSize:12}}>← Retour</button>
      <div style={{flex:1}}><div style={{fontWeight:800,color:C.navy,fontSize:16}}>{lblCls(cls)}</div><div style={{fontSize:12,color:C.gray}}>{cycleCls(cls)} · {cls.annee}</div></div>
      <button onClick={()=>setMElv(true)} style={{background:C.green,border:"none",color:"#fff",padding:"8px 14px",borderRadius:20,cursor:"pointer",fontWeight:700,fontSize:12}}>➕ Élève</button>
    </div>
    <div style={{display:"flex",gap:10,marginBottom:14}}>
      {[["🎒",elvCls.length,"Élèves",C.blue],["📊",elvCls.length?Math.round(elvCls.reduce((s,e)=>s+calcMoy(db.notes[e.id]),0)/elvCls.length*10)/10:0,"Moy.",C.accent],["✅",`${elvCls.filter(e=>(db.presences[e.id]?.[0]?.s||"")!=="Absent").length}/${elvCls.length}`,"Présents",C.green]].map(([ic,v,l,col])=>(
        <div key={l} style={{background:C.white,borderRadius:10,padding:"12px 10px",flex:1,boxShadow:"0 2px 8px rgba(13,43,94,0.07)",borderTop:`3px solid ${col}`,textAlign:"center"}}>
          <div style={{fontSize:20}}>{ic}</div><div style={{fontWeight:800,fontSize:17,color:col}}>{v}</div><div style={{fontSize:11,color:C.gray}}>{l}</div>
        </div>
      ))}
    </div>
    <Card>
      <STit>👨‍🎓 Élèves</STit>
      {elvCls.length===0?<div style={{textAlign:"center",padding:"24px 0",color:C.gray}}><div style={{fontSize:32,marginBottom:8}}>🎒</div>Aucun élève.<br/><button onClick={()=>setMElv(true)} style={{marginTop:12,background:C.blue,border:"none",color:"#fff",padding:"8px 16px",borderRadius:20,cursor:"pointer",fontWeight:700,fontSize:12}}>➕ Ajouter</button></div>
        :elvCls.map((e,i)=>{const moy=calcMoy(db.notes[e.id]);return(
        <div key={e.id} style={{display:"flex",alignItems:"center",gap:10,padding:"12px 0",borderBottom:i<elvCls.length-1?`1px solid ${C.border}`:"none"}}>
          <Av t={ini(e.prenom,e.nom)} size={38} bg={e.genre==="F"?C.purple:C.blue}/>
          <div style={{flex:1}}><div style={{fontWeight:700,color:C.navy,fontSize:13}}>{fullName(e)}</div><div style={{fontSize:11,color:C.gray}}>{e.date_naissance||"—"} · {e.email_parent}</div></div>
          <div style={{textAlign:"center",minWidth:44}}><div style={{fontWeight:800,color:moy>=10?C.green:C.red,fontSize:14}}>{moy}/20</div><div style={{fontSize:10,color:C.gray}}>moy.</div></div>
          <div style={{display:"flex",flexDirection:"column",gap:4}}>
            <button onClick={()=>setMMove(e.id)} style={{background:C.light,border:"none",color:C.blue,padding:"3px 8px",borderRadius:8,cursor:"pointer",fontSize:11,fontWeight:600}}>🔄</button>
            <button onClick={()=>setConf({type:"eleve",id:e.id,label:fullName(e)})} style={{background:"#FDECEC",border:"none",color:C.red,padding:"3px 8px",borderRadius:8,cursor:"pointer",fontSize:11,fontWeight:600}}>✕</button>
          </div>
        </div>
      );})}
    </Card>
    <Card>
      <STit>📊 Capacité</STit>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:13,color:C.navy,marginBottom:8,fontWeight:600}}>
        <span>{elvCls.length} élève{elvCls.length>1?"s":""} inscrits</span>
        <span>{cls.effectif_max-elvCls.length} place{cls.effectif_max-elvCls.length>1?"s":""} disponibles</span>
      </div>
      <div style={{background:C.border,borderRadius:8,height:12}}>
        <div style={{width:`${Math.min(elvCls.length/cls.effectif_max*100,100)}%`,background:elvCls.length>=cls.effectif_max?C.red:elvCls.length/cls.effectif_max>0.8?C.accent:C.green,height:12,borderRadius:8,transition:"width .5s"}}/>
      </div>
      <div style={{fontSize:12,color:C.gray,marginTop:6}}>{Math.round(elvCls.length/cls.effectif_max*100)}% · Max {cls.effectif_max}</div>
    </Card>
  </div>;

  return<div>
    <Toast msg={toast}/>
    {conf&&<Confirm label={conf.label} onOk={doConf} onCancel={()=>setConf(null)}/>}
    {mCls&&<Modal title="🏫 Nouvelle classe" onClose={()=>setMCls(false)}>
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        {["Collège","Lycée"].map(c=><button key={c} onClick={()=>{setCycle(c);setNiveau(c==="Collège"?NIVEAUX_COLLEGE[0]:NIVEAUX_LYCEE[0]);}} style={{flex:1,padding:"10px",borderRadius:10,border:`2px solid ${cycle===c?C.blue:C.border}`,background:cycle===c?C.light:"#fff",color:cycle===c?C.blue:C.gray,cursor:"pointer",fontWeight:700,fontSize:13}}>{c==="Collège"?"🏫 Collège":"🎓 Lycée"}</button>)}
      </div>
      <Sel label="Niveau" value={niveau} onChange={e=>setNiveau(e.target.value)} required>{(cycle==="Collège"?NIVEAUX_COLLEGE:NIVEAUX_LYCEE).map(n=><option key={n}>{n}</option>)}</Sel>
      <Sel label="Section" value={section} onChange={e=>setSection(e.target.value)} required>{SECTIONS.map(s=><option key={s}>{s}</option>)}</Sel>
      {cycle==="Lycée"&&<Sel label="Filière" value={filiere} onChange={e=>setFiliere(e.target.value)} required>{FILIERES.map(f=><option key={f}>{f}</option>)}</Sel>}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <Inp label="Effectif max" value={effMax} onChange={e=>setEffMax(e.target.value)} type="number"/>
        <Inp label="Année" value={annee} onChange={e=>setAnnee(e.target.value)} placeholder="2025-2026"/>
      </div>
      <div style={{background:C.light,borderRadius:10,padding:12,marginBottom:14,textAlign:"center"}}>
        <div style={{fontWeight:800,color:C.navy,fontSize:16}}>{niveau} {section}{cycle==="Lycée"?` · ${filiere}`:""}</div>
        <div style={{fontSize:12,color:C.gray}}>{cycle} · {annee} · Max {effMax}</div>
      </div>
      {clsErr&&<div style={{background:"#FEF2F2",border:`1px solid #FECACA`,borderRadius:8,padding:"9px 12px",marginBottom:12,color:C.red,fontSize:13}}>⚠️ {clsErr}</div>}
      <button onClick={saveCls} style={{width:"100%",padding:11,borderRadius:10,border:"none",background:C.green,color:"#fff",fontWeight:700,fontSize:14,cursor:"pointer"}}>✅ Créer la classe</button>
    </Modal>}
    {mElv&&<Modal title="➕ Ajouter un élève" onClose={()=>setMElv(false)}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}><Inp label="Prénom" value={prenom} onChange={e=>setPrenom(e.target.value)} placeholder="Aya" required/><Inp label="Nom" value={nom} onChange={e=>setNom(e.target.value)} placeholder="Konan" required/></div>
      <Sel label="Genre" value={genre} onChange={e=>setGenre(e.target.value)}><option value="M">Masculin</option><option value="F">Féminin</option></Sel>
      <Inp label="Date de naissance" value={ddn} onChange={e=>setDdn(e.target.value)} placeholder="JJ/MM/AAAA"/>
      <Inp label="Email parent" value={emailP} onChange={e=>setEmailP(e.target.value)} placeholder="parent@email.com" type="email"/>
      <Sel label="Classe" value={cid} onChange={e=>setCid(e.target.value)} required>{db.classes.map(c=>{const nb=db.eleves.filter(e=>e.classe_id===c.id).length;return<option key={c.id} value={c.id}>{lblCls(c)} ({nb}/{c.effectif_max})</option>;})}</Sel>
      {elvErr&&<div style={{background:"#FEF2F2",border:`1px solid #FECACA`,borderRadius:8,padding:"9px 12px",marginBottom:12,color:C.red,fontSize:13}}>⚠️ {elvErr}</div>}
      <button onClick={saveElv} style={{width:"100%",padding:11,borderRadius:10,border:"none",background:`linear-gradient(135deg,${C.navy},${C.blue})`,color:"#fff",fontWeight:700,fontSize:14,cursor:"pointer"}}>➕ Ajouter l'élève</button>
    </Modal>}

    <div style={{display:"flex",gap:7,marginBottom:16,flexWrap:"wrap"}}>
      {["Tous","Collège","Lycée"].map(f=><button key={f} onClick={()=>setFil(f)} style={{padding:"6px 14px",borderRadius:20,border:"none",cursor:"pointer",fontSize:12,background:fil===f?C.navy:C.light,color:fil===f?"#fff":C.navy,fontWeight:600}}>{f}</button>)}
      <button onClick={()=>setMElv(true)} style={{padding:"6px 14px",borderRadius:20,border:"none",background:C.blue,color:"#fff",cursor:"pointer",fontWeight:700,fontSize:12}}>➕ Élève</button>
      <button onClick={()=>setMCls(true)} style={{marginLeft:"auto",padding:"6px 14px",borderRadius:20,border:"none",background:C.green,color:"#fff",cursor:"pointer",fontWeight:700,fontSize:12}}>➕ Classe</button>
    </div>
    <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>
      {[["🏫",db.classes.filter(c=>NIVEAUX_COLLEGE.includes(c.niveau)).length,"Collège",C.blue],["🎓",db.classes.filter(c=>NIVEAUX_LYCEE.includes(c.niveau)).length,"Lycée",C.purple],["🎒",db.eleves.length,"Élèves",C.green]].map(([ic,v,l,col])=>(
        <div key={l} style={{background:C.white,borderRadius:12,padding:"12px 14px",flex:1,minWidth:90,boxShadow:"0 2px 10px rgba(13,43,94,0.07)",borderLeft:`4px solid ${col}`}}>
          <div style={{fontSize:20}}>{ic}</div><div style={{fontWeight:800,fontSize:20,color:col}}>{v}</div><div style={{fontSize:11,color:C.gray}}>{l}</div>
        </div>
      ))}
    </div>
    {clsFil.length===0&&<Card style={{textAlign:"center",padding:40}}><div style={{fontSize:40,marginBottom:10}}>🏫</div><div style={{fontWeight:700,color:C.navy,marginBottom:6}}>Aucune classe</div><button onClick={()=>setMCls(true)} style={{background:C.green,border:"none",color:"#fff",padding:"10px 20px",borderRadius:20,cursor:"pointer",fontWeight:700,fontSize:13}}>➕ Créer une classe</button></Card>}
    {["Collège","Lycée"].map(cyc=>{
      const niveaux=cyc==="Collège"?NIVEAUX_COLLEGE:NIVEAUX_LYCEE;
      const cls2=clsFil.filter(c=>niveaux.includes(c.niveau));
      if(!cls2.length||(fil!=="Tous"&&fil!==cyc))return null;
      return<div key={cyc}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
          <span style={{fontSize:18}}>{cyc==="Collège"?"🏫":"🎓"}</span>
          <span style={{fontWeight:800,color:C.navy,fontSize:15}}>{cyc}</span>
          <Bdg label={`${cls2.length} classe${cls2.length>1?"s":""}`} color={cyc==="Collège"?C.blue:C.purple} bg={cyc==="Collège"?C.light:"#F3E8FF"}/>
        </div>
        {niveaux.map(niv=>{
          const clsN=cls2.filter(c=>c.niveau===niv);if(!clsN.length)return null;
          return<div key={niv} style={{marginBottom:14}}>
            <div style={{fontSize:12,color:C.gray,fontWeight:600,marginBottom:6,paddingLeft:4}}>{niv}</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {clsN.map(c=>{const nb=db.eleves.filter(e=>e.classe_id===c.id).length,plein=nb>=c.effectif_max;
                return<div key={c.id} style={{background:C.white,borderRadius:12,padding:14,boxShadow:"0 2px 10px rgba(13,43,94,0.06)",border:`1.5px solid ${C.border}`,cursor:"pointer"}} onClick={()=>{setClsAct(c);setVue("detail");}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                    <div><div style={{fontWeight:800,color:C.navy,fontSize:15}}>{c.niveau} {c.section}</div>{c.filiere&&<div style={{fontSize:11,color:C.purple,fontWeight:600}}>{c.filiere}</div>}</div>
                    <button onClick={e=>{e.stopPropagation();setConf({type:"classe",id:c.id,label:lblCls(c)});}} style={{background:"#FDECEC",border:"none",color:C.red,width:24,height:24,borderRadius:"50%",cursor:"pointer",fontSize:13,flexShrink:0}}>×</button>
                  </div>
                  <div style={{background:C.border,borderRadius:4,height:5,marginBottom:6}}><div style={{width:`${Math.round(nb/c.effectif_max*100)}%`,background:plein?C.red:C.green,height:5,borderRadius:4}}/></div>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:C.gray}}><span>{nb}/{c.effectif_max} élèves</span><span style={{color:plein?C.red:C.green,fontWeight:700}}>{plein?"Complet":`${c.effectif_max-nb} places`}</span></div>
                </div>;
              })}
            </div>
          </div>;
        })}
      </div>;
    })}
  </div>;
}

// ── PAGE CONNEXION ────────────────────────────────────────────────
function PageConnexion({onLogin}){
  const [id,setId]=useState(""),  [pwd,setPwd]=useState("");
  const [err,setErr]=useState(""), [load,setLoad]=useState(false), [show,setShow]=useState(false);

      {user.role==="parent"     &&<DashParent     db={db} user={user}/>}
      {user.role==="eleve"      &&<DashEleve      db={db} user={user}/>}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
